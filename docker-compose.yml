# Marex — despliegue en la Jetson Orin Nano.
#
# Ollama corre NATIVO en la Jetson (instalador oficial, detecta JetPack y usa
# la GPU): curl -fsSL https://ollama.com/install.sh | sh && ollama pull llama3.2:3b
#
# El backend usa la red del host para ver la interfaz SocketCAN (can0) del
# RH-02 y llegar a Ollama en localhost. Antes: levantar can0 a 250 kbit/s.

services:
  backend:
    build: ./backend
    container_name: marex-backend
    restart: unless-stopped
    network_mode: host # necesario para SocketCAN (can0); expone el puerto 8000
    environment:
      - MAREX_DATA_SOURCE=${MAREX_DATA_SOURCE:-can} # can | simulator
      - MAREX_CAN_CHANNEL=${MAREX_CAN_CHANNEL:-can0}
      - MAREX_OLLAMA_HOST=http://localhost:11434
      - MAREX_LLM_MODEL=${MAREX_LLM_MODEL:-llama3.2:3b}
